app:
  description: 文献综述智能体的项目初始化、检索式生成、手工文献导入、去重与导出工作流
  icon: "\U0001F4DA"
  icon_background: '#D6F5E8'
  icon_type: emoji
  mode: workflow
  name: 文献综述-项目初始化与检索准备
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: http-request
        id: start-to-create-project
        source: 'start_node'
        sourceHandle: source
        target: 'create_project_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: code
        id: create-project-to-parse-project
        source: 'create_project_node'
        sourceHandle: source
        target: 'parse_project_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: http-request
        id: parse-project-to-generate-search
        source: 'parse_project_node'
        sourceHandle: source
        target: 'generate_search_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: code
        id: generate-search-to-parse-search
        source: 'generate_search_node'
        sourceHandle: source
        target: 'parse_search_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: http-request
        id: parse-search-to-import-citations
        source: 'parse_search_node'
        sourceHandle: source
        target: 'import_citations_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: code
        id: import-citations-to-parse-import
        source: 'import_citations_node'
        sourceHandle: source
        target: 'parse_import_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: http-request
        id: parse-import-to-deduplicate
        source: 'parse_import_node'
        sourceHandle: source
        target: 'deduplicate_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: code
        id: deduplicate-to-parse-deduplicate
        source: 'deduplicate_node'
        sourceHandle: source
        target: 'parse_deduplicate_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: http-request
        id: parse-deduplicate-to-export
        source: 'parse_deduplicate_node'
        sourceHandle: source
        target: 'export_bundle_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: code
        id: export-to-parse-export
        source: 'export_bundle_node'
        sourceHandle: source
        target: 'parse_export_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: end
        id: parse-export-to-end
        source: 'parse_export_node'
        sourceHandle: source
        target: 'end_node'
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ''
          selected: false
          title: User Input
          type: start
          variables:
            - label: title
              max_length: 200
              options: []
              required: true
              type: text-input
              variable: title
            - label: research_question
              max_length: 1000
              options: []
              required: true
              type: paragraph
              variable: research_question
            - label: pico_population
              max_length: 500
              options: []
              required: false
              type: text-input
              variable: pico_population
            - label: pico_intervention
              max_length: 500
              options: []
              required: false
              type: text-input
              variable: pico_intervention
            - label: pico_comparator
              max_length: 500
              options: []
              required: false
              type: text-input
              variable: pico_comparator
            - label: pico_outcome
              max_length: 500
              options: []
              required: false
              type: text-input
              variable: pico_outcome
            - label: inclusion_criteria
              max_length: 2000
              options: []
              required: false
              type: paragraph
              variable: inclusion_criteria
            - label: exclusion_criteria
              max_length: 2000
              options: []
              required: false
              type: paragraph
              variable: exclusion_criteria
            - label: citations_payload_json
              max_length: 50000
              options: []
              required: true
              type: paragraph
              variable: citations_payload_json
        height: 430
        id: 'start_node'
        position:
          x: 30
          y: 180
        positionAbsolute:
          x: 30
          y: 180
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            type: no-auth
          body:
            type: json
            data: |
              {
                "title": "{{#start_node.title#}}",
                "research_question": "{{#start_node.research_question#}}",
                "pico_population": "{{#start_node.pico_population#}}",
                "pico_intervention": "{{#start_node.pico_intervention#}}",
                "pico_comparator": "{{#start_node.pico_comparator#}}",
                "pico_outcome": "{{#start_node.pico_outcome#}}",
                "inclusion_criteria": "{{#start_node.inclusion_criteria#}}",
                "exclusion_criteria": "{{#start_node.exclusion_criteria#}}"
              }
          desc: 创建综述项目
          headers: Content-Type:application/json
          method: post
          params: ''
          retry_config:
            enabled: false
            exponential_backoff:
              enabled: false
              max_interval: 10000
              multiplier: 2
            max_retries: 1
            retry_interval: 1000
          ssl_verify: true
          timeout:
            connect: 10
            read: 30
            write: 30
          title: Create Project
          type: http-request
          url: http://host.docker.internal:8010/projects
        height: 90
        id: 'create_project_node'
        position:
          x: 340
          y: 180
        positionAbsolute:
          x: 340
          y: 180
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: "\nimport json\n\ndef main(raw_body: str) -> dict:\n    return {\n        \"result\": json.loads(raw_body),\n    }\n"
          code_language: python3
          desc: 解析项目返回结果
          outputs:
            result:
              children: null
              type: object
          title: Parse Project
          type: code
          variables:
            - value_selector:
                - 'create_project_node'
                - body
              value_type: string
              variable: raw_body
        height: 90
        id: 'parse_project_node'
        position:
          x: 640
          y: 180
        positionAbsolute:
          x: 640
          y: 180
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            type: no-auth
          body:
            type: none
