          desc: 解析检索式
          outputs:
            result:
              children: null
              type: object
          title: Parse Search Strategy
          type: code
          variables:
            - value_selector:
                - 'generate_search_node'
                - body
              value_type: string
              variable: raw_body
        height: 90
        id: 'parse_search_node'
        position:
          x: 1240
          y: 180
        positionAbsolute:
          x: 1240
          y: 180
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            type: no-auth
          body:
            type: json
            data: '{{#start_node.citations_payload_json#}}'
