name: ClinResearch CI

# To enable GitHub Actions, copy this file to .github/workflows/ci.yml using
# credentials that have GitHub's workflow permission.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        run: python -m pip install -e 'apps/literature-review-agent/backend[dev]'
      - name: Backend tests
        run: pytest -q apps/literature-review-agent/backend/tests
      - name: Agent and Skill contract
        run: node scripts/opencode/test-agent-skill-contract.mjs
      - name: Self-contained source release
        run: bash scripts/verify-source-release.sh
      - name: Package source parity
        run: python scripts/opencode/sync-global-package.py
      - name: Reproducible package archives
        run: |
          mkdir -p /tmp/release-a /tmp/release-b
          bash packages/clinresearch-opencode-global/build-release.sh /tmp/release-a
          bash packages/clinresearch-opencode-global/build-release.sh /tmp/release-b
          diff -u /tmp/release-a/clinresearch-opencode-global-0.3.23.sha256 /tmp/release-b/clinresearch-opencode-global-0.3.23.sha256
      - name: Bundled OpenCode source smoke check
        run: |
          test -f vendor/opencode-bundled/package.json
          test -f vendor/opencode-bundled/bun.lock
          test -f vendor/opencode-bundled/packages/desktop/resources/clinresearch-client-retrieval.mjs

  bundled-opencode-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Restore bundled OpenCode dependencies
        working-directory: vendor/opencode-bundled
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile
      - name: Desktop typecheck
        working-directory: vendor/opencode-bundled/packages/desktop
        run: bun run typecheck
      - name: Desktop release contract tests
        working-directory: vendor/opencode-bundled/packages/desktop
        run: bun test ./electron-builder.config.test.ts
